name: Synthetic backend conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/prepare_backends.py --backend both
      - run: python scripts/test_backends.py --engines --output artifacts/backend-runs/ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-backend-evidence-${{ matrix.os }}
          path: artifacts/backend-runs/ci/
          if-no-files-found: error
